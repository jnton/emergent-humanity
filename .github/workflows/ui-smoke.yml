name: UI, animation, and Lighthouse tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ui-animation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static checks
        run: npm run test:static
      - name: Run browser animation checks
        run: npm run test:browser
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Start local site
        run: |
          nohup npm run preview > lighthouse-server.log 2>&1 &
          echo $! > lighthouse-server.pid
      - name: Wait for local site
        run: npx --yes wait-on@9.0.1 http://127.0.0.1:4173
      - name: Run repeated mobile Lighthouse audits
        run: |
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173 \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-mobile-${run}.json"
          done
      - name: Run repeated desktop Lighthouse audits
        run: |
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173 \
              --quiet \
              --preset=desktop \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-desktop-${run}.json"
          done
      - name: Enforce median Lighthouse budgets
        run: node tests/lighthouse-budgets.mjs lighthouse-mobile-*.json lighthouse-desktop-*.json
      - name: Stop local site
        if: always()
        run: |
          if [ -f lighthouse-server.pid ]; then
            kill "$(cat lighthouse-server.pid)" || true
          fi
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: |
            lighthouse-server.log
            lighthouse-mobile-*.json
            lighthouse-desktop-*.json
          retention-days: 14
