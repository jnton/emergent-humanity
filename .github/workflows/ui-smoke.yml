name: UI, interaction, and Lighthouse tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ui-animation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static checks
        run: npm run test:static
      - name: Run browser interaction checks
        run: npm run test:browser
      - name: Run mobile Lighthouse benchmark
        run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run test:lighthouse
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 14
